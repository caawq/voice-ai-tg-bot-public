# Конфиг Alembic. Строка подключения здесь сознательно пустая: URL берётся из
# окружения через config.require_database_url() в db/migrations/env.py, чтобы
# секрет не лежал в файле, который коммитится.

[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os
# Имя файла миграции: 0001_short_slug.py — сортируется по порядку, читается глазами.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
